<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Debug Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left panel with filters and table */
        .left-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #ddd;
        }

        .filters {
            padding: 15px;
            background: #2c3e50;
            color: white;
        }

        .filters h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            white-space: nowrap;
        }

        .filter-group select {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            background: white;
            color: #333;
            min-width: 120px;
        }

        .filter-group input[type="checkbox"] {
            margin: 0;
        }

        .table-header {
            padding: 10px 15px;
            background: #ecf0f1;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-panel {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #ecf0f1;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: #d5dbdb;
        }

        th::after {
            content: ' ↕';
            font-size: 10px;
            opacity: 0.5;
        }

        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        tr {
            cursor: pointer;
        }

        tr:hover {
            background: #f8f9fa;
        }

        tr.selected {
            background: #e3f2fd;
        }

        /* Row color coding */
        tr.high {
            background: #ffebee;
        }

        tr.medium {
            background: #fff9c4;
        }

        tr.low {
            background: #f5f5f5;
        }

        tr.selected.high {
            background: #ffcdd2;
        }

        tr.selected.medium {
            background: #fff59d;
        }

        tr.selected.low {
            background: #e0e0e0;
        }

        .score-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .score-high { background: #27ae60; }
        .score-medium { background: #f39c12; }
        .score-low { background: #e74c3c; }

        /* Right card */
        .detail-panel {
            width: 55%;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .card-header a {
            color: #3498db;
            text-decoration: none;
            margin-right: 10px;
        }

        .card-header a:hover {
            text-decoration: underline;
        }

        .overall-score {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .overall-score .score-value {
            font-size: 48px;
            font-weight: bold;
        }

        .overall-score .score-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .score-bars {
            margin-bottom: 20px;
        }

        .score-bar-item {
            margin-bottom: 15px;
        }

        .score-bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #666;
        }

        .score-bar-track {
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .score-bar-fill.mobile { background: #3498db; }
        .score-bar-fill.ux { background: #9b59b6; }
        .score-bar-fill.trust { background: #e74c3c; }
        .score-bar-fill.cta { background: #2ecc71; }

        .section {
            margin-bottom: 20px;
        }

        .section h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
        }

        .leak-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            color: #856404;
            line-height: 1.6;
        }

        .leak-box.empty {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
        }

        .info-item .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
        }

        .info-item .value {
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        .stats-bar {
            padding: 8px 15px;
            background: #bdc3c7;
            font-size: 11px;
            color: #333;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="filters">
                <h2>Фильтры и сортировка</h2>
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Источник:</label>
                        <select id="filter-source">
                            <option value="all">все</option>
                            <option value="2gis">2gis</option>
                            <option value="yandex_maps">yandex_maps</option>
                            <option value="yell">yell</option>
                            <option value="manual">manual</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Город:</label>
                        <select id="filter-city">
                            <option value="all">все</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <input type="checkbox" id="filter-with-site">
                        <label for="filter-with-site">только с сайтом</label>
                    </div>
                    <div class="filter-group">
                        <input type="checkbox" id="filter-without-site">
                        <label for="filter-without-site">только без сайта</label>
                    </div>
                    <div class="filter-group">
                        <input type="checkbox" id="filter-high-opportunity">
                        <label for="filter-high-opportunity">высокий потенциал (≥70)</label>
                    </div>
                </div>
            </div>
            <div class="table-header">
                <span>Лиды</span>
                <span id="filtered-count">0 из 0</span>
            </div>
            <div class="table-panel">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="business_name">Название</th>
                            <th data-sort="city">Город</th>
                            <th data-sort="source">Источник</th>
                            <th data-sort="overall_score">Балл</th>
                            <th data-sort="mobile_score">Моб.</th>
                            <th data-sort="ux_score">UX</th>
                            <th data-sort="trust_score">Доверие</th>
                            <th data-sort="cta_score">Захват</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table">
                    </tbody>
                </table>
            </div>
            <div class="stats-bar" id="stats-bar">
                кликните по заголовку для сортировки
            </div>
        </div>

        <div class="detail-panel" id="detail-panel">
            <div class="empty-state">
                <h3>Выберите лид из таблицы</h3>
                <p>Нажмите на строку, чтобы увидеть детали аудита</p>
            </div>
        </div>
    </div>

    <script>
        let allLeads = [];
        let filteredLeads = [];
        let currentSort = { column: null, direction: 'asc' };
        const HIGH_OPPORTUNITY_THRESHOLD = 70;

        function getScoreClass(score) {
            if (score >= 70) return 'score-high';
            if (score >= 40) return 'score-medium';
            return 'score-low';
        }

        function getRowClass(score) {
            if (score >= 80) return 'high';
            if (score >= 50) return 'medium';
            return 'low';
        }

        function collectCities() {
            const cities = new Set();
            allLeads.forEach(lead => {
                if (lead.city) cities.add(lead.city);
            });
            return Array.from(cities).sort();
        }

        function populateCityFilter() {
            const select = document.getElementById('filter-city');
            const currentValue = select.value;
            select.innerHTML = '<option value="all">все</option>';
            collectCities().forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                select.appendChild(option);
            });
            select.value = currentValue;
        }

        function applyFilters() {
            const sourceFilter = document.getElementById('filter-source').value;
            const cityFilter = document.getElementById('filter-city').value;
            const withSite = document.getElementById('filter-with-site').checked;
            const withoutSite = document.getElementById('filter-without-site').checked;
            const highOpportunity = document.getElementById('filter-high-opportunity').checked;

            filteredLeads = allLeads.filter(lead => {
                if (sourceFilter !== 'all' && lead.source !== sourceFilter) return false;
                if (cityFilter !== 'all' && lead.city !== cityFilter) return false;
                if (withSite && !lead.website) return false;
                if (withoutSite && lead.website) return false;
                if (highOpportunity && lead.overall_score < HIGH_OPPORTUNITY_THRESHOLD) return false;
                return true;
            });

            applySort();
        }

        function applySort() {
            if (currentSort.column) {
                filteredLeads.sort((a, b) => {
                    let valA = a[currentSort.column];
                    let valB = b[currentSort.column];
                    if (typeof valA === 'string') {
                        valA = valA.toLowerCase();
                        valB = valB.toLowerCase();
                    }
                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('leads-table');
            const totalCount = document.getElementById('count');
            const filteredCount = document.getElementById('filtered-count');

            totalCount.textContent = allLeads.length;
            filteredCount.textContent = `${filteredLeads.length} из ${allLeads.length}`;

            tbody.innerHTML = filteredLeads.map((lead, idx) => {
                const rowClass = getRowClass(lead.overall_score);
                return `
                    <tr data-idx="${idx}" class="${rowClass}">
                        <td>${lead.business_name}</td>
                        <td>${lead.city || '-'}</td>
                        <td>${lead.source}</td>
                        <td><span class="score-badge ${getScoreClass(lead.overall_score)}">${lead.overall_score}/100</span></td>
                        <td>${lead.mobile_score !== null ? lead.mobile_score : '-'}</td>
                        <td>${lead.ux_score !== null ? lead.ux_score : '-'}</td>
                        <td>${lead.trust_score !== null ? lead.trust_score : '-'}</td>
                        <td>${lead.cta_score !== null ? lead.cta_score : '-'}</td>
                    </tr>
                `;
            }).join('');

            tbody.addEventListener('click', (e) => {
                const row = e.target.closest('tr');
                if (row) {
                    document.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
                    row.classList.add('selected');
                    renderDetail(parseInt(row.dataset.idx));
                }
            });
        }

        function renderDetail(idx) {
            const lead = filteredLeads[idx];
            const panel = document.getElementById('detail-panel');

            const scores = [
                { key: 'mobile', label: 'Мобильность', value: lead.mobile_score, color: '#3498db' },
                { key: 'ux', label: 'Понятность сайта', value: lead.ux_score, color: '#9b59b6' },
                { key: 'trust', label: 'Доверие к бизнесу', value: lead.trust_score, color: '#e74c3c' },
                { key: 'cta', label: 'Захват заявок', value: lead.cta_score, color: '#2ecc71' }
            ];

            const validScores = scores.filter(s => s.value !== null);
            const minScore = validScores.length > 0 ? validScores.reduce((min, s) => s.value < min ? s.value : min, 100) : null;
            const mainPain = minScore !== null ? validScores.find(s => s.value === minScore) : null;

            const leakText = lead.notes || 'критичных дыр не найдено, конверсия утекает минимально';

            panel.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2>${lead.business_name}</h2>
                        <div>
                            ${lead.website ? `<a href="${lead.website}" target="_blank">🌐 сайт</a>` : ''}
                            ${lead.maps_url ? ` | <a href="${lead.maps_url}" target="_blank">📍 карточка</a>` : ''}
                        </div>
                    </div>

                    <div class="overall-score">
                        <div class="score-value">${lead.overall_score}/100</div>
                        <div class="score-label">общий балл конверсии</div>
                    </div>

                    <div class="score-bars">
                        ${scores.map(s => `
                            <div class="score-bar-item">
                                <div class="score-bar-header">
                                    <span>${s.label}</span>
                                    <span>${s.value !== null ? s.value + '/100' : '—'}</span>
                                </div>
                                <div class="score-bar-track">
                                    <div class="score-bar-fill ${s.key}" style="width: ${s.value !== null ? s.value : 0}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section">
                        <h3>Главная боль</h3>
                        <div class="leak-box ${!mainPain ? 'empty' : ''}">
                            ${mainPain ? `самая слабая метрика — "${mainPain.label}" (${mainPain.value}/100)` : leakText}
                        </div>
                    </div>

                    <div class="section">
                        <h3>Куда утекает конверсия</h3>
                        <div class="leak-box ${!lead.notes || lead.notes.includes('критичных дыр не найдено') ? 'empty' : ''}">
                            ${leakText}
                        </div>
                    </div>

                    <div class="section">
                        <h3>Информация</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="label">Источник</div>
                                <div class="value">${lead.source}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">Город</div>
                                <div class="value">${lead.city || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">Телефон</div>
                                <div class="value">${lead.phone || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">Статус сайта</div>
                                <div class="value">${lead.site_status}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadData() {
            try {
                const response = await fetch('leads_debug.json');
                if (!response.ok) throw new Error('Failed to load JSON');
                allLeads = await response.json();
                filteredLeads = [...allLeads];
                populateCityFilter();
                applyFilters();

                // Setup sort listeners
                document.querySelectorAll('th[data-sort]').forEach(th => {
                    th.addEventListener('click', () => {
                        const column = th.dataset.sort;
                        document.querySelectorAll('th[data-sort]').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
                        if (currentSort.column === column) {
                            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                        } else {
                            currentSort.column = column;
                            currentSort.direction = 'asc';
                        }
                        th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                        applySort();
                    });
                });

                // Setup filter listeners
                ['filter-source', 'filter-city', 'filter-with-site', 'filter-without-site', 'filter-high-opportunity'].forEach(id => {
                    document.getElementById(id).addEventListener('change', applyFilters);
                });

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('leads-table').innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">Ошибка загрузки данных</td></tr>';
            }
        }

        loadData();
    </script>
</body>
</html>
